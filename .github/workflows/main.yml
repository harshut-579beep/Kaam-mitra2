name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Assets Direct
        run: |
          # Bina kisi folder ke, direct root par execute karein
          rm -f bun.lock package-lock.json
          npm install --legacy-peer-deps
          npx vite build || true

      - name: Configure Android SDK and Sync
        run: |
          # Direct root ke andar android folder trace karein
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          npx cap sync android --no-build || true

      - name: Accept Android Licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compile and Assemble APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaam-Mitra-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
