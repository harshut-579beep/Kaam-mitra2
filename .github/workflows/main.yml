name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Extract Project ZIP
        run: |
          set -eu

          if [ -f "package.json" ]; then
            echo "Project files already exist."
          elif [ -f "remix-kaam-mitra.zip" ]; then
            unzip -o remix-kaam-mitra.zip -d extracted
            if [ -f "extracted/package.json" ]; then
              cp -a extracted/. .
            else
              PROJECT_DIR=$(find extracted -name package.json \
                -not -path '*/node_modules/*' \
                -not -path '*/android/*' \
                -print -quit | xargs -r dirname)

              if [ -z "$PROJECT_DIR" ]; then
                echo "ERROR: package.json not found in ZIP."
                exit 1
              fi

              cp -a "$PROJECT_DIR"/. .
            fi
          else
            echo "ERROR: Project ZIP or package.json not found."
            ls -la
            exit 1
          fi

          test -f package.json || {
            echo "ERROR: package.json missing from project root."
            exit 1
          }

      - name: Install Web Dependencies
        run: |
          npm install --legacy-peer-deps --force

      - name: Build Web Assets
        run: |
          npm run build

      - name: Check Android Project
        run: |
          test -d android || {
            echo "ERROR: Android project directory missing."
            exit 1
          }

          test -f android/gradlew || {
            echo "ERROR: Android Gradle wrapper missing."
            exit 1
          }

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaam-Mitra-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
