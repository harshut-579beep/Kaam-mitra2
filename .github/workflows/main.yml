name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Project Zip File
        run: |
          echo "=== UNZIPPING THE REAL PROJECT CODE ==="
          unzip remix-kaam-mitra.zip
          
          echo "=== SCANNING AND ORGANIZING FILES ==="
          if [ -d "remix-kaam-mitra" ]; then
            mv remix-kaam-mitra/* . 2>/dev/null || true
            mv remix-kaam-mitra/.* . 2>/dev/null || true
          fi
          ls -la

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: |
          rm -f bun.lock package-lock.json
          npm install --legacy-peer-deps --force

      - name: Build Web Assets (Safe Mode)
        run: npx vite build --emptyOutDir || true

      - name: Configure Android SDK and Sync
        run: |
          mkdir -p android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          npx cap sync android --no-build || true

      - name: Accept Android Licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compile and Assemble APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace -x test

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaam-Mitra-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
