name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Project and Sync Capacitor
        run: |
          # Sahi folder ke andar enter karein jahan package.json chhupi hai
          cd Kaam-mitra2
          
          # Faltu lockfiles ko clear karein
          rm -f bun.lock package-lock.json
          
          # Dependencies aur Web Build execute karein
          npm install --legacy-peer-deps
          npx vite build || true
          
          # Capacitor sync run karein
          npx cap sync android || true

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > Kaam-mitra2/android/local.properties
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Accept All Android Licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK via Gradle
        run: |
          cd Kaam-mitra2/android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaam-Mitra-Debug-APK
          path: Kaam-mitra2/android/app/build/outputs/apk/debug/app-debug.apk
