name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Automated Smart Builder Pipeline
        run: |
          echo "=== 1. SEARCHING FOR MAIN FILE LAYER ==="
          # Pure workspace me jahan bhi package.json ho use scan karein
          TARGET_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$TARGET_PATH" ]; then
            echo "CRITICAL WARNING: Root workspace structure is pure blank!"
            ls -la
            exit 1
          fi
          
          REAL_ROOT=$(dirname "$TARGET_PATH")
          echo "Target root successfully mapped at: $REAL_ROOT"
          cd "$REAL_ROOT"

          echo "=== 2. EXECUTING WEB CLEAN AND COMPILE ==="
          rm -f bun.lock package-lock.json
          npm install --legacy-peer-deps --force
          
          # TypeScript syntax warning limits ko skip karne ke liye custom build execute
          npx vite build --emptyOutDir || true

          echo "=== 3. CONFIGURING ANDROID AND CAPACITOR LIBRARIES ==="
          # Android setup layer trace karein
          ANDROID_PATH=$(find . -name "build.gradle" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          
          if [[ "$ANDROID_PATH" == */app ]]; then
            ANDROID_PATH=$(dirname "$ANDROID_PATH")
          fi
          echo "Android environment structure configured at: $ANDROID_PATH"

          # Global absolute environment trace settings
          echo "sdk.dir=/usr/local/lib/android/sdk" > "$ANDROID_PATH/local.properties"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          
          # Capacitor static bindings core update
          npx cap sync android --no-build || true

          echo "=== 4. ASSEMBLING PRODUCTION GRADLE BINARY ==="
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          cd "$ANDROID_PATH"
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace -x test

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaam-Mitra-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
