name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan and Build Project Automatically
        run: |
          # 1. package.json ka sahi folder dhoondhein
          PACKAGE_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Main web project folder found at: $PACKAGE_DIR"
          cd "$PACKAGE_DIR"
          
          # Faltu lockfiles ko clear karein
          rm -f bun.lock package-lock.json
          
          # Web dependencies install aur build karein
          npm install --legacy-peer-deps
          npx vite build || true
          
          # 2. android folder ka sahi path dhoondhein
          cd $GITHUB_WORKSPACE
          ANDROID_DIR=$(find . -name "build.gradle" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Android configuration folder found at: $ANDROID_DIR"
          
          # local.properties me SDK ka rasta daalein
          echo "sdk.dir=/usr/local/lib/android/sdk" > "$ANDROID_DIR/local.properties"
          
          # Main android module ke root me jaakar Capacitor sync chalaayein
          cd "$PACKAGE_DIR"
          npx cap sync android || true
          
          # 3. Android build project par switch karein aur APK banayein
          cd $GITHUB_WORKSPACE
          GRADLE_DIR=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$GRADLE_DIR"
          
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaam-Mitra-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
